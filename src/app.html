<!doctype html>

<html lang="%lang%" data-theme="">
  <head>
    <!-- Basic Meta Tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    
    <!-- Page-specific indexing directives are emitted by the SEO component. -->
    <meta name="author" content= "Stocknear" />
    
    <!-- Canonical URL is set dynamically per page via SEO component -->
    
    <!-- Language and Region -->
    <meta name="geo.region" content="US" />
    <meta name="geo.placename" content="United States" />
    
    <!-- Additional SEO Tags -->
    <!-- %stocknear.themeColor% is substituted per request in hooks.server.ts so
         the browser chrome matches the active theme's page surface. -->
    <meta name="theme-color" content="%stocknear.themeColor%" />
    <meta name="color-scheme" content="light dark" />
    <meta name="msapplication-navbutton-color" content="%stocknear.themeColor%" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/space-grotesk.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Icons and Manifest -->
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    
    <!-- Third-party preconnects are injected only when consented marketing loads -->

    <!-- Marketing/Analytics scripts (GTM) loaded conditionally in +layout.svelte based on cookie consent -->

    <!-- Route-scoped locale scripts must run before Svelte hydrates. -->
    %stocknear.i18n%

    %sveltekit.head%
  </head>


  
  <!-- Global background color -->
  <body
    data-sveltekit-preload-data="hover"
    class="overflow-x-hidden font-sans"
  >
    <div>%sveltekit.body%</div>
  </body>
</html>
